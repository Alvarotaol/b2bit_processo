name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:alpine
        ports: ['6379:6379']

      celery:
        image: rabbitmq:3-management-alpine
        ports: ['5672:5672']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy env
        run: cp backend/.env.ci backend/.env

      - name: Build and start services
        run: docker-compose -f docker-compose.prod.yml up -d --build

      - name: Wait for backend
        run: |
          for i in {1..10}; do
            if docker exec backend python manage.py migrate; then
              break
            fi
            echo "Waiting for backend..."
            sleep 5
          done

      - name: Run tests
        run: docker exec backend pytest

      - name: Shut down services
        if: always()
        run: docker-compose -f docker-compose.prod.yml down
